# Alembic configuration for the ClaimsRAG database schema. Run from backend/: `.venv/bin/alembic upgrade head`.
# No database URL is stored here: migrations/env.py builds it from Settings (the POSTGRES_* variables).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# Keep at WARNING: at INFO, SQLAlchemy logs every statement with its parameters (for example, password hashes).
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
