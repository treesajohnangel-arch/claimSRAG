[pytest]
testpaths = tests
pythonpath = .
# -m "not database": the default run never needs PostgreSQL. Run those tests with `pytest -m database`.
addopts = -ra --strict-markers -m "not database and not embedding_model and not llm"
# Keep the suite warning-free: a new warning fails the run until it is fixed or explicitly ignored here.
filterwarnings =
    error
markers =
    database: needs a running PostgreSQL (docker compose up -d postgres); deselected by default, run with -m database
    embedding_model: needs the local embedding model files in backend/.model_cache (no network at test time); deselected by default, run with -m embedding_model
    llm: needs the local Ollama server with the configured model (LLM_MODEL); may connect to loopback only; deselected by default, run with -m llm
    security: security regression test (secret handling, error exposure; later tenant isolation); run with -m security
